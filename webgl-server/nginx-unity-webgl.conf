# Include this inside your server block and adjust /path/to/WebGLBuild.
# Unity WebGL Brotli files must be served with Content-Encoding: br.

root /path/to/WebGLBuild;
index index.html;

location = /index.html {
    add_header Cache-Control "no-cache";
}

location ~* \.data\.br$ {
    gzip off;
    add_header Content-Encoding br;
    add_header Cache-Control "public, max-age=31536000, immutable";
    default_type application/octet-stream;
}

location ~* \.wasm\.br$ {
    gzip off;
    add_header Content-Encoding br;
    add_header Cache-Control "public, max-age=31536000, immutable";
    default_type application/wasm;
}

location ~* \.js\.br$ {
    gzip off;
    add_header Content-Encoding br;
    add_header Cache-Control "public, max-age=31536000, immutable";
    default_type application/javascript;
}

location ~* \.symbols\.json\.br$ {
    gzip off;
    add_header Content-Encoding br;
    add_header Cache-Control "public, max-age=31536000, immutable";
    default_type application/json;
}

location ~* \.(bundle|hash|json|bin)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}
